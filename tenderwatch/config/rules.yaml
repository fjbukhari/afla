# Relevance rules for Tender Watch.
# Each term is a regular-expression fragment matched (case-insensitive, whole words) against the tender title.
# strong terms = 3 points, medium = 2, weak = 1 (weak terms are also matched against the organisation).
# A tender is RELEVANT when it hits at least one strong/medium term AND score >= threshold.
# exclude terms subtract exclude_penalty each (half when the title also has a strong term).
# core: true categories are JBS core business; a strong hit there tags the tender CORE.
# health_orgs / generic_supply: when the buyer is a hospital/lab, vague titles such as
# "Generic Consumables" or "Life Saving Medical Supplies" count as medium terms (+ health_org_bonus).
# Edit freely, then run:  python -m tw rescore
threshold: 3
exclude_penalty: 4
works_type_penalty: 2
health_org_bonus: 1
